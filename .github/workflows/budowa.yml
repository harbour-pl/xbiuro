#
#
#

name: Budowa

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: xbiuro
    steps:
      - uses: actions/checkout@v4
        with:
          path: xbiuro
      - uses: actions/checkout@v4
        with:
          repository: harbour-pl/xwgui
          path: xwgui
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: make mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-libharu mingw-w64-clang-x86_64-curl mingw-w64-clang-x86_64-openssl
      - run: make
